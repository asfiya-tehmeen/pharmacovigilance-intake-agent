[project]
name = "pvagent"
version = "0.1.0"
description = "Pharmacovigilance case-intake agent on real VAERS reports, with signal-impact evaluation"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0", "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "rapidfuzz>=3.6",
  "pydantic>=2.5", "httpx>=0.27", "pyyaml>=6", "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
pv = "pvagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
